[package]
name = "hook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
plugin_hook = []

[dependencies]
agent-contracts = { path = "../agent-contracts" }
agent-types = { path = "../agent-types" }
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
# tokio is needed by the plugin hooker subprocess driver (`run_plugin_subprocess`)
# which uses `tokio::process::Command` + `tokio::time::timeout` so a hung plugin
# script cannot block the async agent-loop task forever.
# 注意：rt feature 已在 workspace Cargo.toml 中提供，此处不需重复声明
tokio = { workspace = true, features = ["io-util", "process", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
