[package]
name = "hook"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
plugin_hook = []

[dependencies]
agent-contracts = { path = "../agent-contracts" }
agent-types = { path = "../agent-types" }
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# tokio is needed by the plugin hooker subprocess driver (`run_plugin_subprocess`)
# which uses `tokio::process::Command` + `tokio::time::timeout` so a hung plugin
# script cannot block the async agent-loop task forever.
tokio = { workspace = true, features = ["rt", "process", "time", "io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros"] }
