[package]
name = "operation_backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
agent-contracts = { path = "../agent-contracts" }
agent-types = { path = "../agent-types" }
async-trait.workspace = true
glob = "0.3"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[bin]]
name = "xiaoo-backend-cli"
path = "src/bin/backend_cli.rs"
