[package]
name = "xiaoo-serverside"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tee_sdf = ["xiaoo-shared/tee_sdf"]

[[bin]]
name = "xiaoo-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = "0.7"
chrono.workspace = true
dirs = "6"
futures-util.workspace = true
governor = "0.6"
mime_guess.workspace = true
prost = "0.13"
regex = "1.11"
reqwest.workspace = true
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rust-embed.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util.workspace = true
toml.workspace = true
tower = { workspace = true }
tower_governor = "0.4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror.workspace = true
url = "2.5"
uuid.workspace = true
cron.workspace = true
shellexpand.workspace = true

# 白名单直依赖（已裁定不进 xiaoo-api）：
agent-contracts = { path = "../../crates/agent-contracts" }  # 仅限 ChannelFileSender/HookActionSink/MAX_ACTION_DEPTH/ToolRegistryBuilder/backend::{BackendLifecycleState,BackendEndpoint}
agent-types = { path = "../../crates/agent-types" }          # 仅限 cron 域与 tool 配置词汇（ToolRegistryConfig/ToolVisibilityConfig/ToolExecutionStatus）
llm-client = { path = "../../crates/llm-client" }            # 仅限 resolved-profile 两段式 provider 装配（create_llm_provider_from_resolved/resolve_provider_profile/ResolvedConfig）
skill = { path = "../../crates/skill" }                     # 仅限 SkillsConfig 配置类型
subagent = { path = "../../crates/subagent" }               # 仅限 SubagentControl 及 Spawn/Join 请求响应类型
prompt = { path = "../../crates/prompt" }                   # 仅限 compose_channel_system_prompt/ChannelPromptSections
tool = { path = "../../crates/tool" }                       # 仅限工具装配面（load_tool_sources_with_services/ToolRuntimeServices/ToolRegistryBuilderImpl/SubagentRoleConfig/ToolRouter）
mcp = { path = "../../crates/mcp" }                         # 仅限配置解析全族 + MCP server 宿主实现
lsp = { path = "../../crates/lsp" }                         # 仅限配置解析（LspServiceRegistry）
operation_backend = { path = "../../crates/operation_backend" }  # 仅限进程组清理（ProcessGroupCleanupGuard）
# runtime SDK 面 / 应用装配面：
xiaoo-shared = { path = "../shared" }                       # 应用装配面
xiaoo-api = { path = "../../crates/xiaoo-api" }             # runtime SDK 门面

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
