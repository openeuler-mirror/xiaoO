[package]
name = "xiaoo-serverside"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tee_sdf = ["xiaoo-shared/tee_sdf"]

[[bin]]
name = "xiaoo-daemon"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = "0.7"
chrono.workspace = true
dirs = "6"
futures-util.workspace = true
governor = "0.6"
mime_guess.workspace = true
prost = "0.13"
regex = "1.11"
reqwest.workspace = true
rmcp = { version = "=2.2.0", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
rust-embed.workspace = true
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tokio-util.workspace = true
toml.workspace = true
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = "0.4"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror.workspace = true
url = "2.5"
uuid.workspace = true
cron.workspace = true
shellexpand.workspace = true

# 应用只直依赖两个门面：runtime SDK 门面 + 应用装配门面。
# 底层 crates（agent-types/llm-client/tool/mcp/...）一律经 xiaoo-shared 装配门面访问，不在本处直依赖。

xiaoo-shared = { path = "../shared" }                       # 应用装配门面（粗粒度装配入口 + 最小词汇）
xiaoo-api = { path = "../../crates/xiaoo-api" }             # runtime SDK 门面（冻结面）

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }
