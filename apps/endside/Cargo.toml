[package]
name = "xiaoo-endside"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
tee_sdf = ["xiaoo-shared/tee_sdf"]

[[bin]]
name = "xiaoo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
arboard = { workspace = true }
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
crossterm.workspace = true
dirs = "6"
futures-util.workspace = true
ratatui.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shellexpand.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-width = "0.1.14"
uuid.workspace = true
textwrap = "0.16"

# runtime SDK 门面 / 应用装配面（粗粒度装配入口 + 最小词汇）：
xiaoo-api = { path = "../../crates/xiaoo-api" }            # runtime SDK 门面（冻结面）
xiaoo-shared = { path = "../shared" }                      # 应用装配门面

[dev-dependencies]
tempfile.workspace = true
xiaoo-shared = { path = "../shared", features = ["test-support"] }
