[package]
name = "xiaoo-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"
publish = false

[dependencies]
agent-client-protocol = { version = "=3.4.0", default-features = false }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["compat"] }
toml.workspace = true
uuid.workspace = true
xiaoo-api = { path = "../../crates/xiaoo-api" }
xiaoo-shared = { path = "../shared" }

[build-dependencies]
semver = "1"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process"] }

[[test]]
name = "acp_stdio"
path = "../../tests/system/acp/stdio_test.rs"
